name: Deno Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.40.x"

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "permit2-rpc-proxy"
          entrypoint: "./src/deno-server.ts"
          root: "packages/permit2-rpc-server"
