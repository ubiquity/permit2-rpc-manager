name: Deno Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'packages/permit2-rpc-server/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/permit2-rpc-server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "permit2-rpc-proxy"
          entrypoint: "packages/permit2-rpc-server/src/deno-server.ts"
