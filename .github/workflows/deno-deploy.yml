name: Deno Deploy

on:
  push:
    branches:
      - main # Trigger on pushes to main
  pull_request:
    branches:
      - main # Trigger on PRs targeting main (for preview deployments)
  repository_dispatch:
    types: [trigger-deno-deploy]

jobs:
  deploy:
    name: Deploy to Deno Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to checkout the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install deployctl
        run: deno install -A -r https://deno.land/x/deploy/deployctl.ts

      - name: Deploy using manual script
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          chmod +x scripts/manual-deploy.sh
          ./scripts/manual-deploy.sh
