name: Update Multicall3 Deployments

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SOURCE_URL: https://raw.githubusercontent.com/mds1/multicall3/refs/heads/main/deployments.json
  TARGET_PATH: packages/permit2-rpc-server/multicall3-deployments.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure target directory exists
        run: |
          mkdir -p "$(dirname "$TARGET_PATH")"

      - name: Download latest deployments.json
        run: |
          echo "Downloading $SOURCE_URL"
          curl -fL --retry 5 --retry-delay 2 "$SOURCE_URL" -o "$TARGET_PATH.tmp"
          # Validate JSON
          cat "$TARGET_PATH.tmp" | jq . > /dev/null
          # Replace target atomically
          mv "$TARGET_PATH.tmp" "$TARGET_PATH"

      - name: Commit changes (if any)
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_PATH"
          if git commit -m "chore: weekly Multicall3 deployments update"; then
            echo "committed=true" >> $GITHUB_OUTPUT
            git push
          else
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi

      - name: Trigger Deno Deploy workflow
        if: steps.commit.outputs.committed == 'true'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-deno-deploy

      - name: Summary
        run: |
          echo "Committed: ${{ steps.commit.outputs.committed }}" >> $GITHUB_STEP_SUMMARY
          echo "Target: $TARGET_PATH" >> $GITHUB_STEP_SUMMARY
          echo "Source: $SOURCE_URL" >> $GITHUB_STEP_SUMMARY
