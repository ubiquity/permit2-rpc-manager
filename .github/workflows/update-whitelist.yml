name: Update RPC Whitelist

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install chainlist dependencies
        working-directory: lib/chainlist
        run: bun install

      - name: Create out directory
        run: mkdir -p lib/chainlist/out

      - name: Generate chainlist JSON
        working-directory: lib/chainlist
        run: bun generate-json.js

      - name: Install root dependencies
        run: bun install

      - name: Set up matrix
        id: set-matrix
        run: |
          CHAINS=$(node -e "console.log(JSON.stringify(Array.from(require('./tests/constants.ts').CRITICAL_CHAINS)))")
          echo "matrix=${CHAINS}" >> $GITHUB_OUTPUT

  update-and-test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chain: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install chainlist dependencies
        working-directory: lib/chainlist
        run: bun install

      - name: Generate chainlist JSON
        working-directory: lib/chainlist
        run: |
          mkdir -p out
          bun generate-json.js

      - name: Update and test chain ${{ matrix.chain }}
        run: |
          # Update whitelist for this chain
          UPDATE_CHAIN=${{ matrix.chain }} bun run scripts/update-whitelist.mjs
          # Test the updated whitelist for this chain
          TEST_CHAIN=${{ matrix.chain }} bun run scripts/test-whitelist.mjs

      - name: Upload partial whitelist
        uses: actions/upload-artifact@v4
        with:
          name: whitelist-chain-${{ matrix.chain }}
          path: packages/permit2-rpc-server/rpc-whitelist.json
          if-no-files-found: error

  finalize:
    needs: [update-and-test]
    runs-on: ubuntu-latest
    if: always() && !contains(needs.*.result, 'failure')
    permissions:
      contents: write # For git push
      actions: write # For repository dispatch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - uses: actions/download-artifact@v4
        with:
          pattern: whitelist-chain-*
          path: artifacts

      - name: Debug artifacts
        run: |
          echo "Full directory structure:"
          find artifacts -type f -ls

          echo "\nArtifact contents:"
          for f in artifacts/whitelist-chain-*/rpc-whitelist.json; do
            echo "\nFile: $f"
            cat "$f"
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: List artifacts directory
        run: |
          echo "Artifacts directory contents:"
          ls -la artifacts/
          echo "Checking whitelist files:"
          ls -la artifacts/whitelist-chain-*

      - name: Merge whitelists
        run: |
          bun run scripts/merge-whitelists.mjs artifacts packages/permit2-rpc-server/rpc-whitelist.json

      - name: Check for changes
        id: check
        run: |
          echo "changed=$(git diff --quiet packages/permit2-rpc-server/rpc-whitelist.json || echo 'true')" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check.outputs.changed == 'true' || inputs.force_update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/permit2-rpc-server/rpc-whitelist.json
          git commit -m "chore: weekly whitelist update"
          git push

      - name: Trigger Deno Deploy workflow
        if: steps.check.outputs.changed == 'true' || inputs.force_update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-deno-deploy
