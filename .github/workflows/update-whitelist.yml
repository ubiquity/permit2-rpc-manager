name: Update RPC Whitelist

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if no changes detected"
        required: false
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install chainlist dependencies
        working-directory: lib/chainlist
        run: bun install

      - name: Create out directory
        run: mkdir -p lib/chainlist/out

      - name: Generate chainlist JSON
        working-directory: lib/chainlist
        run: bun generate-json.js

      - name: Install root dependencies
        run: bun install

      - name: Update whitelist
        id: update
        run: |
          bun run scripts/update-whitelist.mjs
          echo "changed=$(git diff --quiet packages/permit2-rpc-server/rpc-whitelist.json || echo 'true')" >> $GITHUB_OUTPUT

      - name: Set up matrix
        id: set-matrix
        run: |
          CHAINS=$(node -e "console.log(JSON.stringify(Array.from(require('./tests/constants.ts').CRITICAL_CHAINS)))")
          echo "matrix=${CHAINS}" >> $GITHUB_OUTPUT

  test-chains:
    needs: setup
    if: needs.setup.outputs.changed == 'true' || inputs.force_update
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chain: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install dependencies
        run: bun install

      - name: Test chain ${{ matrix.chain }}
        run: TEST_CHAIN=${{ matrix.chain }} bun run scripts/test-whitelist.mjs

  finalize:
    needs: [setup, test-chains]
    if: always() && !contains(needs.*.result, 'failure') && (needs.setup.outputs.changed == 'true' || inputs.force_update)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/permit2-rpc-server/rpc-whitelist.json
          git commit -m "chore: weekly whitelist update"
          git push

      - name: Deploy to Deno Deploy
        run: |
          cd packages/permit2-rpc-server
          deno task deploy
